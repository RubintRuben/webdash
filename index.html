        (function () {
            // Every host needs its scheme and no trailing slash: the request
            // path is swapped between hosts by prefix.
            var GD_PROXY_HOSTS = [
                "https://gd-proxy.webdashers.workers.dev",
                "https://webdashers.webdashersdevelopement.workers.dev",
                "https://fallbackgdproxy.webdashers.workers.dev",
                "https://fallback2.webdashers.workers.dev"
            ];
            var ATTEMPT_TIMEOUT_MS = 12000;
            window._gdProxyUrl = GD_PROXY_HOSTS[0];
            window._gdProxyHosts = GD_PROXY_HOSTS;
            var activeIndex = 0;
            var nativeFetch = window.fetch.bind(window);
            function matchingHost(url) {
                for (var i = 0; i < GD_PROXY_HOSTS.length; i++) {
                    var host = GD_PROXY_HOSTS[i];
                    if (url.indexOf(host) === 0 && (url.length === host.length || url.charAt(host.length) === "/" || url.charAt(host.length) === "?")) return host;
                }
                return null;
            }
            // A worker over its Cloudflare quota answers 429 ("error code:
            // 1027"); 5xx, network errors and timeouts also move on.
            function shouldRetry(res) {
                return res.status === 429 || res.status === 408 || res.status >= 500;
            }
            window.fetch = function (input, init) {
                var isRequestObj = (typeof Request !== "undefined") && (input instanceof Request);
                var url = isRequestObj ? input.url : input;
                if (typeof url !== "string") return nativeFetch(input, init);
                var oldHost = matchingHost(url);
                if (!oldHost) return nativeFetch(input, init);
                var path = url.slice(oldHost.length);
                var callerSignal = (init && init.signal) || (isRequestObj ? input.signal : null);
                var tried = 0, lastResponse = null, lastError = null;
                function attempt(hostIndex) {
                    var host = GD_PROXY_HOSTS[hostIndex];
                    var controller = (typeof AbortController !== "undefined") ? new AbortController() : null;
                    var timer = null, opts = Object.assign({}, init || {});
                    if (controller) {
                        if (callerSignal) {
                            if (callerSignal.aborted) controller.abort();
                            else callerSignal.addEventListener("abort", function () { controller.abort(); });
                        }
                        timer = setTimeout(function () { controller.abort(); }, ATTEMPT_TIMEOUT_MS);
                        opts.signal = controller.signal;
                    }
                    var attemptInput = isRequestObj ? new Request(host + path, input) : host + path;
                    tried++;
                    return nativeFetch(attemptInput, opts).then(function (res) {
                        if (timer) clearTimeout(timer);
                        if (shouldRetry(res) && tried < GD_PROXY_HOSTS.length) {
                            lastResponse = res;
                            return attempt((hostIndex + 1) % GD_PROXY_HOSTS.length);
                        }
                        if (!shouldRetry(res)) { activeIndex = hostIndex; window._gdProxyUrl = host; }
                        return res;
                    }, function (err) {
                        if (timer) clearTimeout(timer);
                        if (callerSignal && callerSignal.aborted) throw err;
                        lastError = err;
                        if (tried < GD_PROXY_HOSTS.length) return attempt((hostIndex + 1) % GD_PROXY_HOSTS.length);
                        if (lastResponse) return lastResponse;
                        throw lastError;
                    });
                }
                return attempt(activeIndex);
            };
        })();
